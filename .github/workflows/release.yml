name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # 当推送 v 开头的语义化版本 tag 时触发，如 v0.0.1, v1.2.3

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET Framework
      run: |
        echo "Using system .NET Framework"
    
    - name: Inject Version
      run: |
        $version = "${{ github.ref_name }}"
        $content = Get-Content Program.cs -Raw
        $content = $content -replace '{{VERSION}}', $version
        Set-Content Program.cs $content
      shell: pwsh
    
    - name: Build
      run: |
        # Try to find .NET Framework compiler with fallback
        $possiblePaths = @(
          "C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe",
          "C:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319\\csc.exe",
          "C:\\Windows\\Microsoft.NET\\Framework64\\v4.8.30319\\csc.exe",
          "C:\\Windows\\Microsoft.NET\\Framework\\v4.8.30319\\csc.exe"
        )
        
        $cscPath = $null
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            $cscPath = $path
            break
          }
        }
        
        if (-not $cscPath) {
          Write-Host "Could not find .NET Framework compiler"
          exit 1
        }
        
        Write-Host "Using compiler: $cscPath"
        & $cscPath /target:winexe `
          /out:ClipboardImageSaver.exe `
          /win32icon:icon.ico `
          /reference:System.dll `
          /reference:System.Core.dll `
          /reference:System.Windows.Forms.dll `
          /reference:System.Drawing.dll `
          /reference:Microsoft.CSharp.dll `
          Program.cs
      shell: pwsh
    
    - name: Delete old release if exists
      run: |
        gh release delete ${{ github.ref_name }} --yes 2>$null || $true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release Package
      run: |
        New-Item -ItemType Directory -Path Release -Force
        Copy-Item ClipboardImageSaver.exe Release/
        # 尝试复制 RELEASE-README.md（如果存在）
        if (Test-Path "RELEASE-README.md") {
          Copy-Item RELEASE-README.md Release/README.md
          Write-Host "RELEASE-README.md 已复制到发布包"
        } else {
          Write-Host "RELEASE-README.md 不存在，跳过复制"
          # 创建一个简单的 README
          Set-Content -Path "Release/README.md" -Value @"
# Clipboard Image Saver - 剪贴板图片保存工具

轻量级 Windows 图片粘贴工具，体积仅 9KB，开源免费

## 使用方法
1. 双击运行 `ClipboardImageSaver.exe`
2. 右键托盘图标配置快捷键

**网站**: [sevencn.com](https://sevencn.com)
"@
        }
        Compress-Archive -Path Release/* -DestinationPath ClipboardImageSaver-${{ github.ref_name }}.zip
      shell: pwsh
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: false
        make_latest: true
        files: |
          ClipboardImageSaver-${{ github.ref_name }}.zip
          ClipboardImageSaver.exe
        body: |
          ## 下载
          
          - **完整包**: `ClipboardImageSaver-${{ github.ref_name }}.zip`
          - **单文件**: `ClipboardImageSaver.exe`
          
          ## 更新内容
          
          请查看 [CHANGELOG.md](CHANGELOG.md)
          
          ## 使用方法
          
          1. 下载并解压
          2. 双击运行 `ClipboardImageSaver.exe`
          3. 右键托盘图标配置快捷键
          
          **网站**: [sevencn.com](https://sevencn.com)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
