name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'v1.1.0'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET Framework
      run: |
        echo "Using system .NET Framework"
    
    - name: Inject Version
      run: |
        $manual = "${{ inputs.version }}"
        $ref = "${{ github.ref_name }}"
        $sha = "${{ github.sha }}"
        $shortSha = $sha.Substring(0,7)
        $refFull = $env:GITHUB_REF
        if ([string]::IsNullOrWhiteSpace($manual)) {
          if ($refFull -like 'refs/tags/*') { $version = $ref } else { $version = "dev-$ref-$shortSha" }
        } else { $version = $manual }
        $content = Get-Content Program.cs -Raw
        $content = $content -replace '{{VERSION}}', $version
        Set-Content Program.cs $content
        Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"
      shell: pwsh
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: dotnet restore
      shell: pwsh

    - name: Build with MSBuild
      run: |
        msbuild ClipboardImageSaver.csproj /p:Configuration=Release /p:Platform=AnyCPU
        # After building, the exe will be in bin/Release/net472/
        Copy-Item -Path "bin/Release/net472/ClipboardImageSaver.exe" -Destination "ClipboardImageSaver.exe"
      shell: pwsh
    
    - name: Delete old release if exists
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        gh release delete "${{ github.ref_name }}" --yes || true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create Release Package
      run: |
        New-Item -ItemType Directory -Path Release -Force
        Copy-Item ClipboardImageSaver.exe Release/
        if (Test-Path "RELEASE-README.md") {
          Copy-Item RELEASE-README.md Release/README.md
        } else {
          $lines = @(
            '# Clipboard Image Saver - 剪贴板图片保存工具',
            '',
            '轻量级 Windows 图片粘贴工具，体积仅 9KB，开源免费',
            '',
            '## 使用方法',
            '1. 双击运行 `ClipboardImageSaver.exe`',
            '2. 右键托盘图标配置快捷键',
            '',
            '**网站**: [sevencn.com](https://sevencn.com)'
          )
          Set-Content -Path "Release/README.md" -Value ($lines -join [Environment]::NewLine) -Encoding UTF8
        }
        Compress-Archive -Path Release/* -DestinationPath "ClipboardImageSaver-$($env:VERSION).zip"
      shell: pwsh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ClipboardImageSaver-${{ env:VERSION }}
        path: |
          ClipboardImageSaver.exe
          ClipboardImageSaver-${{ env:VERSION }}.zip
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: false
        make_latest: true
        files: |
          ClipboardImageSaver-${{ github.ref_name }}.zip
          ClipboardImageSaver.exe
        body: |
          ## 下载
          
          - **完整包**: `ClipboardImageSaver-${{ github.ref_name }}.zip`
          - **单文件**: `ClipboardImageSaver.exe`
          
          ## 更新内容
          
          请查看 [CHANGELOG.md](CHANGELOG.md)
          
          ## 使用方法
          
          1. 下载并解压
          2. 双击运行 `ClipboardImageSaver.exe`
          3. 右键托盘图标配置快捷键
          
          **网站**: [sevencn.com](https://sevencn.com)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}